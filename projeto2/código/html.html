<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link rel="stylesheet" href="./stylesheet.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

  <!-- Sidebar Lateral -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo" id="logoBtn" title="Alternar menu">
        <span class="logo-icon"><img style="height: 50px; width:50px; margin-right: 20px;"
            src="../imagens/WhatsApp Image 2026-08-20 at 13.25.47.jpeg" alt=""></span>
        <span class="logo-text">MeuSite</span>
      </div>
      <button class="toggle-btn" id="toggleBtn" aria-label="Recolher menu">&#10094;</button>
    </div>

    <ul class="nav-list">
      <li class="nav-item"><a href="#home" class="nav-link"><span class="icon"><img class="img" width="20" height="20"
              src="https://img.icons8.com/ios-filled/50/FFFFFF/home.png" alt="home" /></span><span
            class="text">Home</span></a></li>
      <br>
      <li class="nav-item"><a href="#produtos" class="nav-link"><span class="icon"><img class="img" width="25"
              height="25" src="https://img.icons8.com/ios-filled/50/FFFFFF/user-male-circle.png"
              alt="user-male-circle" /></span><span class="text">Personagens</span></a></li>
      <br>
      <li class="nav-item"><a href="#servicos" class="nav-link"><span class="icon"> <img width="20" height="20"
              src="https://img.icons8.com/ios-filled/50/FFFFFF/about.png" alt="about" />
          </span><span class="text">Sobre</span></a></li>
      <br>
      <li class="nav-item"><a href="#portfolio" class="nav-link"><span class="icon"><img width="20" height="20"
              src="https://img.icons8.com/ios-filled/50/FFFFFF/paint-palette.png" alt="paint-palette" /></span><span
            class="text">Portfólio</span></a></li>
      <br>
      <li class="nav-item"><a href="#blog" class="nav-link"><span class="icon"><img width="20" height="20"
              src="https://img.icons8.com/ios-filled/50/FFFFFF/blog.png" alt="blog" /></span><span
            class="text">Blog</span></a></li>
      <br>
      <li class="nav-item"><a href="#contato" class="nav-link"><span class="icon"><img width="20" height="20"
              src="https://img.icons8.com/ios-filled/50/FFFFFF/phone.png" alt="phone" /></span><span
            class="text">Contato</span></a></li>
    </ul>
  </nav>

  <main class="main-content">
    <button class="open-btn" id="openBtn" aria-label="Abrir menu">☰ Menu</button>
    <div class="carrossel"> <img id="imagem1" src="../imagens/banner.png" alt=""></div>
  </main>

  <script src="script.js"></script>
</body>

</html>
